<!DOCTYPE html>
<html lang="om">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carraa Biiftuu - Form Ajajaa</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/css/intlTelInput.css"/>
  
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; padding: 20px; margin: 0; }
    .card { background: white; max-width: 500px; margin: auto; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { color: #0F5132; margin-top: 0; text-align: center; }
    .counter-box { background: #e8f5e9; color: #2e7d32; padding: 12px; border-radius: 8px; text-align: center; font-weight: bold; margin-bottom: 20px; border: 1px solid #c8e6c9; }
    .account-box { background: #e3f2fd; color: #0d47a1; padding: 14px; border-radius: 8px; font-size: 15px; margin-top: 10px; border: 1px solid #bbdefb; display: none; line-height: 1.6; }
    label { font-weight: 600; margin-top: 14px; display: block; color: #333; }
    input, select, button { width: 100%; padding: 12px; margin-top: 6px; border-radius: 6px; border: 1px solid #ccc; font-size: 15px; }
    .iti { width: 100%; margin-top: 6px; }
    input[readonly] { background: #f9f9f9; font-weight: bold; color: #0F5132; }
    button { background: #0F5132; color: white; border: none; font-size: 16px; font-weight: bold; margin-top: 22px; cursor: pointer; transition: 0.3s; }
    button:hover { background: #0b3d26; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .status { margin-top: 15px; font-weight: bold; text-align: center; font-size: 14px; }
    .selected-box { margin-top: 6px; font-size: 13px; color: #0F5132; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card" id="appCard">
    <h2>Carraa Biiftuu</h2>
    <div class="counter-box">
      Carraan Hafe: <span id="remainingCount">1000</span> / 1000 (1 Ticket = 1000 ETB)
    </div>
    
    <form id="orderForm">
      <label>1. Maqaa Guutuu:</label>
      <input type="text" id="name" required placeholder="Fkn: Lemmaa Asefa">

      <label>2. Lakk. Bilbilaa (International):</label>
      <input type="tel" id="phone" required>

      <label>3. Email Address:</label>
      <input type="email" id="email" required placeholder="example@gmail.com">

      <label>4. Baay'ina Carraa Bituu Feetu (Max 10):</label>
      <input type="number" id="qty" min="1" max="10" value="1" required onchange="handleQtyChange()">

      <label>Gatii Waliigalaa (ETB):</label>
      <input type="text" id="totalPrice" readonly value="1000 ETB">

      <label>5. Lakk. Carraa Filadhu (<span id="selectPrompt">1 Select</span>):</label>
      <select id="ticketSelect" required onchange="handleTicketDropdown()">
        <option value="">-- Carraa Duwwaa Filadhu --</option>
      </select>
      <div id="selectedTicketsDisplay" class="selected-box"></div>

      <label>6. Mala Kaffaltii:</label>
      <select id="paymentMethod" required onchange="handlePaymentChange()">
        <option value="">-- Mala Kaffaltii Filadhu --</option>
        <option value="Telebirr">Telebirr</option>
        <option value="CBE">CBE (Baankii Daddala)</option>
        <option value="BOA">Bank of Abyssinia (BOA)</option>
        <option value="Awash">Awash Bank</option>
      </select>
      <div id="accountDetails" class="account-box"></div>

      <label>7. Mallaqa Kaffalame (ETB):</label>
      <input type="number" id="paidAmount" required placeholder="Fkn: 1000">

      <label>8. Transaction ID (Lakk. Kaffaltii):</label>
      <input type="text" id="txnId" required placeholder="Fkn: TX12345678">

      <label>9. Screenshot Kaffaltii (Fakkii Ragaa):</label>
      <input type="file" id="screenshot" accept="image/*" required>

      <button type="submit" id="submitBtn">GALMEESSI</button>
    </form>
    <div id="statusMsg" class="status"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/intlTelInput.min.js"></script>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxrJMFYrybfQVMW8cWTN7r9uY8NtAKxsRg0BMYZPjwYGd0syqijTVvrG8xHB643oDz6/exec";
    let TICKET_PRICE = 1000;
    
    let ACCOUNTS_DATA = {
      Telebirr: { number: "0909506573", name: "Lemma Asefa" },
      CBE: { number: "1000342728743", name: "Lemma Asefa" },
      BOA: { number: "212322628", name: "Lemma Asefa" },
      Awash: { number: "013351316799600", name: "Lemma Asefa" }
    };
    let freeTickets = [];
    let selectedTickets = [];

    const phoneInputField = document.querySelector("#phone");
    const phoneInput = window.intlTelInput(phoneInputField, {
      utilsScript: "https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.8/js/utils.js",
      initialCountry: "et",
      separateDialCode: true,
      preferredCountries: ["et"]
    });

    function populateDefaultTickets() {
      freeTickets = Array.from({length: 1000}, (_, i) => i + 1);
      renderTicketsDropdown(freeTickets);
    }

    function renderTicketsDropdown(ticketsList) {
      document.getElementById('remainingCount').innerText = ticketsList.length;
      const select = document.getElementById('ticketSelect');
      select.innerHTML = '<option value="">-- Carraa Duwwaa Filadhu --</option>';
      ticketsList.forEach(num => {
        const opt = document.createElement('option');
        opt.value = num;
        opt.innerText = "Carraa #" + num;
        select.appendChild(opt);
      });
    }

    async function loadTickets() {
      try {
        const res = await fetch(WEB_APP_URL);
        const data = await res.json();
        
        if (data.ok && Array.isArray(data.free) && data.free.length > 0) {
          freeTickets = data.free;
          TICKET_PRICE = data.price || 1000;
          if (data.accounts) ACCOUNTS_DATA = data.accounts;
          renderTicketsDropdown(freeTickets);
        } else {
          populateDefaultTickets();
        }
      } catch(e) {
        populateDefaultTickets();
      }
      handleQtyChange();
    }

    function handleQtyChange() {
      const qty = parseInt(document.getElementById('qty').value) || 1;
      const total = qty * TICKET_PRICE;
      document.getElementById('totalPrice').value = total + " ETB";
      document.getElementById('paidAmount').value = total;
      document.getElementById('selectPrompt').innerText = qty + " Select";
      selectedTickets = [];
      document.getElementById('selectedTicketsDisplay').innerText = "";
    }

    function handlePaymentChange() {
      const method = document.getElementById('paymentMethod').value;
      const box = document.getElementById('accountDetails');
      if (method && ACCOUNTS_DATA[method]) {
        const acc = ACCOUNTS_DATA[method];
        box.style.display = "block";
        box.innerHTML = `📌 <b>Odeeffannoo Kaffaltii ${method}:</b><br>👤 <b>Maqaa Receiver:</b> ${acc.name}<br>💳 <b>Lakk. Account:</b> <span style="font-size: 16px; font-weight: bold;">${acc.number}</span>`;
      } else {
        box.style.display = "none";
        box.innerHTML = "";
      }
    }

    function handleTicketDropdown() {
      const select = document.getElementById('ticketSelect');
      const val = select.value;
      const qty = parseInt(document.getElementById('qty').value) || 1;

      if (val && !selectedTickets.includes(val)) {
        if (selectedTickets.length < qty) {
          selectedTickets.push(val);
        } else {
          selectedTickets = [val];
        }
      }
      document.getElementById('selectedTicketsDisplay').innerText = "Carraawwan Filataman: " + selectedTickets.map(t => "#" + t).join(", ");
    }

    document.getElementById('orderForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const name = document.getElementById('name').value.trim();
      if (!name) { alert("1. Maaloo maqaa guutuu keessan galchaa!"); document.getElementById('name').focus(); return; }

      if (!phoneInput.isValidNumber()) { alert("2. Maaloo lakkofsa bilbilaa sirrii galchaa!"); document.getElementById('phone').focus(); return; }

      const email = document.getElementById('email').value.trim();
      if (!email) { alert("3. Maaloo imeelii sirrii galchaa!"); document.getElementById('email').focus(); return; }

      const qty = parseInt(document.getElementById('qty').value) || 1;
      if (selectedTickets.length !== qty) {
        alert("5. Maaloo lakkofsa carraa " + qty + " filadhaa!");
        document.getElementById('ticketSelect').focus();
        return;
      }

      const method = document.getElementById('paymentMethod').value;
      if (!method) { alert("6. Maaloo mala kaffaltii filadhaa!"); return; }

      const paidAmt = parseFloat(document.getElementById('paidAmount').value);
      const expectedTotal = qty * TICKET_PRICE;
      if (paidAmt !== expectedTotal) {
        alert("7. Mallaqni galchitan (" + paidAmt + " ETB) gatii carraa filatameetiin (" + expectedTotal + " ETB) waliin wal hin simu!");
        document.getElementById('paidAmount').focus();
        return;
      }

      const txn = document.getElementById('txnId').value.trim();
      if (!txn) { alert("8. Maaloo Transaction ID kaffaltii galchaa!"); document.getElementById('txnId').focus(); return; }

      const fileInput = document.getElementById('screenshot').files[0];
      if (!fileInput) { alert("9. Maaloo screenshot kaffaltii upload godhaa!"); return; }

      const submitBtn = document.getElementById('submitBtn');
      const statusMsg = document.getElementById('statusMsg');
      
      submitBtn.disabled = true;
      statusMsg.style.color = "#333";
      statusMsg.innerText = "Galmeessaa jira, maaloo eegaa...";

      const reader = new FileReader();
      reader.onload = async function() {
        const payload = {
          name: name,
          phone: phoneInput.getNumber(),
          email: email,
          qty: qty,
          tickets: selectedTickets.map(Number),
          method: method,
          paidAmount: paidAmt,
          txn: txn,
          image: reader.result
        };

        try {
          const res = await fetch(WEB_APP_URL, {
            method: "POST",
            body: JSON.stringify(payload)
          });
          const result = await res.json();
          
          if (result.ok) {
            document.getElementById('appCard').innerHTML = `
              <div style="text-align: center; padding: 10px;">
                <h2 style="color: #0F5132;">Galatoomaa! 🎉</h2>
                <p style="font-size: 16px;">Ajajni keessan milkaa'inaan galmeeffameera.</p>
                <hr style="border: 0.5px solid #eee; margin: 15px 0;">
                <p><b>Lakk. Carraa Kee:</b> ${selectedTickets.map(t => "#" + t).join(", ")}</p>
                <p><b>Gatii Kaffalame:</b> ${result.total} ETB</p>
                <p><b>Order ID:</b> ${result.id}</p>
                <p style="color: #666; font-size: 13px; margin-top: 15px;">Haala kaffaltii keessanii ilaalchisee ergaan email irratti isiniif ergama.</p>
              </div>
            `;
          } else {
            statusMsg.style.color = "red";
            statusMsg.innerText = result.error;
            submitBtn.disabled = false;
          }
        } catch(err) {
          statusMsg.style.color = "red";
          statusMsg.innerText = "Dogoggorri uumameera. Maaloo irra deebi'ii yaalaa!";
          submitBtn.disabled = false;
        }
      };

      reader.readAsDataURL(fileInput);
    });

    loadTickets();
  </script>
</body>
</html>
